<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뽀모도로 타이머</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="outer-card">
    <div class="inner-card">
      <h1 class="main-title">뽀모도로 타이머</h1>
      <div id="mode-text" class="sub-title">집중 시간</div>
      <div id="timer-display" class="timer-text">25:00</div>

      <div class="button-row">
        <button id="toggle-btn" class="btn primary-btn">시작</button>
        <button id="reset-btn" class="btn secondary-btn">초기화</button>
      </div>

      <button id="switch-mode-btn" class="btn switch-btn">집중/휴식 바꾸기</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
